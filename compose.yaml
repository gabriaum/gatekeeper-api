services:
  mysql:
    image: mysql:8.0
    container_name: gatekeeper-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gatekeeper}
      MYSQL_USER: ${MYSQL_USER:-gatekeeper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gatekeeper}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: gatekeeper-api
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gatekeeper}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-gatekeeper}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-gatekeeper}
      # JWT secret for the API. In production, provide this via environment or Docker secrets.
      JWT_SECRET: ${JWT_SECRET:-change_this_secret}
      # Optional: create a default admin user on startup (set to "true" to enable). When enabled, set ADMIN_CPF, ADMIN_EMAIL and ADMIN_PASSWORD.
      ADMIN_CREATE: ${ADMIN_CREATE:-false}
      ADMIN_CPF: ${ADMIN_CPF:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

    ports:
      - "8080:8080"

volumes:
  mysql_data: