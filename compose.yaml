services:
  mysql:
    image: mysql:8.0
    container_name: gatekeeper-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gatekeeper
      MYSQL_USER: gatekeeper
      MYSQL_PASSWORD: gatekeeper

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: gatekeeper-api
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gatekeeper?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: gatekeeper
      SPRING_DATASOURCE_PASSWORD: gatekeeper

    ports:
      - "8080:8080"

volumes:
  mysql_data: